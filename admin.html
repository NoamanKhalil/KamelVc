<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login — Kamel Ventures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 120px;
      height: auto;
      margin: 0 auto 24px;
      display: block;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #111;
      margin-bottom: 4px;
    }

    .sub {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 28px;
    }

    .err {
      display: none;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      margin-bottom: 16px;
      transition: border-color .18s, box-shadow .18s;
    }

    input[type="password"]:focus {
      border-color: #111;
      box-shadow: 0 0 0 3px rgba(0,0,0,.06);
    }

    button {
      width: 100%;
      padding: 12px;
      background: #111;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity .15s;
    }

    button:hover { opacity: .85; }
    button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="camel.png" alt="Kamel Ventures"/>
    <h1>Admin Login</h1>
    <p class="sub">Kamel Ventures · Signups Dashboard</p>

    <div class="err" id="err">Incorrect password. Please try again.</div>

    <form method="POST" action="admin.php" id="form">
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" placeholder="Enter admin password" required autofocus/>
      <button type="submit" id="btn">Sign in</button>
    </form>
  </div>

  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('err').style.display = 'block';
    }

    document.getElementById('form').addEventListener('submit', function() {
      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
    });
  </script>
</body>
</html>
